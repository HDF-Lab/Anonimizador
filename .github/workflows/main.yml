name: Main Build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle and caches
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and generate coverage
        run: ./gradlew :app:jacocoTestReport

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-test-results-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-jacoco-report-${{ github.sha }}
          path: |
            app/build/reports/jacoco/jacocoTestReport/html/
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-main-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
